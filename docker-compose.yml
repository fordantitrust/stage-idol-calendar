# Idol Stage Timetable - Docker Compose Configuration
# Quick start: docker-compose up -d

version: '3.8'

services:
  web:
    build: .
    container_name: idol-stage-calendar
    ports:
      - "8000:80"
    volumes:
      # Mount ICS files directory (for easy updates)
      - ./ics:/var/www/html/ics:ro

      # Mount cache directory (for persistence) — favorites/, ratelimit/, logs/, images/
      - ./cache:/var/www/html/cache

      # Mount database (for persistence) — calendar.db + .setup_locked
      - ./data:/var/www/html/data

      # Mount config for Admin UI runtime settings — required so the
      # google/telegram/email/webpush/favorites *-config.json files persist
      # across rebuilds.
      - ./config:/var/www/html/config

      # Uploaded images (artist/event/site covers + galleries).
      # Without this mount, uploaded images are LOST on every rebuild/recreate.
      - ./uploads:/var/www/html/uploads

      # Database backups created via Admin → Settings → Backup
      - ./backups:/var/www/html/backups
    environment:
      # PHP Configuration
      - PHP_MEMORY_LIMIT=256M
      - PHP_UPLOAD_MAX_FILESIZE=10M
      - PHP_POST_MAX_SIZE=10M

      # Timezone
      - TZ=Asia/Bangkok
    restart: unless-stopped
    networks:
      - idol-calendar-network

  # Optional: phpMyAdmin-style SQLite browser (uncomment if needed)
  # adminer:
  #   image: adminer:latest
  #   container_name: idol-stage-adminer
  #   ports:
  #     - "8080:8080"
  #   environment:
  #     - ADMINER_DEFAULT_SERVER=web
  #   restart: unless-stopped
  #   networks:
  #     - idol-calendar-network

networks:
  idol-calendar-network:
    driver: bridge

# Note: this stack persists data via host bind mounts (./data, ./config,
# ./uploads, ./backups, ./cache) declared above — no named volumes are used.
# Back up those host directories directly.
