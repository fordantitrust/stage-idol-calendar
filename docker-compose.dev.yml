# Docker Compose for Development
# Usage: docker-compose -f docker-compose.dev.yml up

version: '3.8'

services:
  web:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: idol-stage-calendar-dev
    ports:
      - "8000:80"
    volumes:
      # Mount the entire project for live development. This single mount also
      # persists data/, config/, uploads/, and backups/ to the host, so the
      # separate bind mounts used in docker-compose.yml are not needed here.
      # The full mount also makes tests/ available: php tests/run-tests.php works.
      - .:/var/www/html

      # Anonymous volume so the container uses its own cache/ (favorites,
      # ratelimit, logs, images) instead of the host copy — ephemeral in dev.
      - /var/www/html/cache
    environment:
      # PHP Development Configuration
      - PHP_MEMORY_LIMIT=512M
      - PHP_DISPLAY_ERRORS=On
      - PHP_ERROR_REPORTING=E_ALL
      - TZ=Asia/Bangkok

      # Enable development mode
      - PRODUCTION_MODE=false
    restart: unless-stopped
    networks:
      - idol-calendar-dev-network

    # Override command for development (enable hot reload if needed)
    command: apache2-foreground

networks:
  idol-calendar-dev-network:
    driver: bridge
